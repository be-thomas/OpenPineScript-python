[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openpinescript"
version = "0.2.0"
description = "Run TradingView Pine Script (v1-v6) locally and offline: indicators, plots and strategy backtests. Python wrapper over the openpinescript engine, no Node install needed."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "be-thomas" }]
keywords = ["pine-script", "pinescript", "tradingview", "backtesting", "trading", "technical-analysis", "indicators"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["nodejs-wheel-binaries>=20"]

[project.optional-dependencies]
pandas = ["pandas"]

[project.scripts]
openpinescript = "openpinescript._cli:main"

[project.urls]
Homepage = "https://be-thomas.github.io/OpenPineScript/"
"Zeal Terminal" = "https://zealterminal.com"
Repository = "https://github.com/be-thomas/OpenPineScript-python"
Documentation = "https://be-thomas.github.io/OpenPineScript/"
Engine = "https://github.com/be-thomas/OpenPineScript"
Issues = "https://github.com/be-thomas/OpenPineScript-python/issues"

[tool.hatch.build]
# _engine/ is git-ignored (produced by scripts/vendor_engine.py), so name it explicitly.
artifacts = ["src/openpinescript/_engine/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/openpinescript"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "hatch_build.py", "README.md", "LICENSE", "CONTRIBUTING.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
